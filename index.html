    <script>
        const PASSWORD = "0807";     // Your password

        let entered = "";

        const camera = document.querySelector(".camera-body");

        const title = document.getElementById("screenTitle");

        const hearts = document.querySelectorAll(".code-heart span");

        const buttons = document.querySelectorAll(".keypad-button");

        buttons.forEach(button => {

            button.addEventListener("click", () => {

                const value = button.innerText;

                if (value === "DEL") {

                    if (entered.length > 0) {

                        entered = entered.slice(0, -1);

                        const heart = hearts[entered.length];

                        heart.style.color = "#d1d5db";

                        heart.style.fontVariationSettings = "'FILL' 0";

                    }

                    return;

                }

                if (entered.length == 4) return;

                entered += value;

                const heart = hearts[entered.length - 1];

                heart.style.color = "#dc2626";

                heart.style.fontVariationSettings = "'FILL' 1";

                heart.animate([
                    { transform: "scale(1)" },
                    { transform: "scale(1.35)" },
                    { transform: "scale(1)" }
                ], { duration: 220 });

                if (entered.length == 4) {

                    setTimeout(checkPassword, 300);

                }

            });

        });

        function checkPassword() {

            if (entered === PASSWORD) {

                camera.classList.add("unlock");

                title.innerHTML = "Unlocked ❤️";

                setTimeout(showLoading, 1000);

            }
            else {

                camera.classList.add("shake");

                title.innerHTML = "Wrong Password";

                setTimeout(() => {

                    camera.classList.remove("shake");

                    title.innerHTML = "Enter Code";

                    entered = "";

                    hearts.forEach(h => {

                        h.style.color = "#d1d5db";

                        h.style.fontVariationSettings = "'FILL' 0";

                    });

                }, 700);

            }

        }

        const heartContainer = document.querySelector(".hearts");

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";

            heart.innerHTML = "❤";

            heart.style.left = Math.random() * 150 + "vw";

            heart.style.fontSize = (15 + Math.random() * 20) + "px";

            heart.style.animationDuration = (5 + Math.random() * 2) + "s";

            heart.style.opacity = Math.random() * 0.5;

            heartContainer.appendChild(heart);

            setTimeout(() => heart.remove(), 10000);

        }

        setInterval(createHeart, 300);

        function showLoading(){

    document.getElementById("loadingScreen").classList.add("show");

    setTimeout(()=>{

        window.location.href="birthday.html";

    },4000);

}

window.addEventListener("pageshow", function (event) {

    // Hide loading screen when returning with Back button
    const loading = document.getElementById("loadingScreen");
    if (loading) {
        loading.classList.remove("show");
    }

    // Reset password
    entered = "";

    // Reset title
    document.getElementById("screenTitle").innerHTML = "Enter Code";

    // Reset hearts
    document.querySelectorAll(".code-heart span").forEach(heart => {
        heart.style.color = "#d1d5db";
        heart.style.fontVariationSettings = "'FILL' 0";
    });

    // Remove animations
    document.querySelector(".camera-body").classList.remove("unlock");
    document.querySelector(".camera-body").classList.remove("shake");

});
